<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Salary Increase Application</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Employee Salary Increase</h2>
        <form action="/" method="POST">
            <div class="form-group">
                <label for="employee_name">Employee Name:</label>
                <input type="text" id="employee_name" name="employee_name" required maxlength="50">
            </div>
            
            <div class="form-group">
                <label for="employee_id">Employee ID:</label>
                <input type="number" id="employee_id" name="employee_id" required max="99">
            </div>
            
            <div class="form-group">
                <label for="salary">Employee Salary:</label>
                <input type="number" id="salary" name="salary" required max="999999">
            </div>
            
            <button type="submit">Increase Salary</button>
        </form>

       
        {% if new_salary %}
        <div class="result">
            <p>The increase salary is $ {{ "%.2f"|format(new_salary) }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
