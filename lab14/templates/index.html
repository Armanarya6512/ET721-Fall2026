<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Item</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1 class="title">Arman Arya</h1>
    <h2> Create Item </h2>
    <form id="itemForm">
        <div class="formsession">
            <label>Name:
                <input type="text" id="name" name="name" required>
            </label>
        </div>

        <div class="formsession">
            <label>Price:
                <input type="number" id="price" name="price" step="0.01" required>
            </label>
        </div>

        <div class="formsession">
            <button type="submit">SUBMIT</button>
        </div>

        <p id ="response"></p>
    </form>
    <!-- LOADING ITEMS  -->
    <section class="loaditems">
        <h2>All items</h2>
        <button onclick="loadItems()">Load Items</button>

        <ul class="itemslist">

        </ul>
    </section>

    <!-- TABLE TO UPDATE AND ITEM NAME AND PRICE -->
     <section id="updatesection" style="display:none;">
        <h3>Update Item</h3>
        <input type="hidden" id="updateID">
        <label>Name:
            <input type="text" id="updateName">
        </label>
        <label>Price:
            <input type="text" id="updatePrice" >
        </label>

        <button onclick="updateItem()">SAVE UPDATE</button>
     </section>

    <script src="{{url_for('static', filename='app_script.js') }}"></script>
</body>
</html>
